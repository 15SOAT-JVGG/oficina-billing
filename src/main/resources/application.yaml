quarkus:
  application:
    name: ${project.artifactId}
    version: ${project.version}

  banner:
    enabled: true

  default-locale: pt_BR

  http:
    port: 8080

  management:
    enabled: true
    host: 0.0.0.0
    port: 9000
    root-path: /q

  micrometer:
    export:
      prometheus:
        path: metrics
    binder:
      http-server:
        enabled: true
      jvm: true

  security:
    jaxrs:
      deny-unannotated-endpoints: true

  # Nenhum banco implícito: os *IT recebem o Postgres do PostgresTestResource.
  devservices:
    enabled: false

  # Banco próprio do Billing (spec #106, história 35). POSTGRES_SSLMODE controla a criptografia
  # do transporte: `disable` serve o Postgres local do docker compose; o RDS exige `require`.
  datasource:
    db-kind: postgresql
    username: ${POSTGRES_USERNAME:billing}
    password: ${POSTGRES_PASSWORD:changeme}
    jdbc:
      url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:oficina_billing}?currentSchema=oficina_billing&sslmode=${POSTGRES_SSLMODE:disable}
    reactive:
      url: postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:oficina_billing}?search_path=oficina_billing&sslmode=${POSTGRES_SSLMODE:disable}
      # Acompanha POSTGRES_SSLMODE: sem isto o cliente reativo valida a cadeia do certificado e o
      # handshake com o RDS falha, porque a CA da AWS não está no truststore da JVM.
      trust-all: ${POSTGRES_TRUST_ALL:false}

  # O Flyway é o único dono do schema; o Hibernate apenas valida (ADR-0002).
  hibernate-orm:
    physical-naming-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    schema-management:
      strategy: validate
    database:
      default-schema: oficina_billing
    log:
      sql: false
      format-sql: true

  flyway:
    migrate-at-start: true
    schemas: oficina_billing
    create-schemas: true
    locations: db/migration

  otel:
    sdk:
      # Export desligado no desenvolvimento local sem coletor; o ambiente liga só o tracing OTLP.
      disabled: ${OTEL_SDK_DISABLED:true}
    exporter:
      otlp:
        endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
        protocol: grpc
        timeout: 3s
    traces:
      sampler: ${OTEL_TRACES_SAMPLER:parentbased_traceidratio}
    metrics:
      exporter: none
    logs:
      exporter: none
    propagators: tracecontext,baggage
    resource:
      attributes:
        - "service.name=${quarkus.application.name}"
        - "service.version=${quarkus.application.version}"

  log:
    console:
      json:
        enabled: true
        pretty-print: false
        additional-field:
          service:
            value: ${quarkus.application.name}
          version:
            value: ${quarkus.application.version}
          environment:
            value: ${APP_ENVIRONMENT:local}

  smallrye-openapi:
    # OpenAPI fica no servidor principal (8080), publicado pelo gateway; health e métricas na 9000.
    management:
      enabled: false
    path: /q/openapi
    info-title: Oficina Billing API
    info-version: ${project.version}
    info-description: Billing service of the mechanic workshop (16SOAT - Tech Challenge Phase 4)
    info-license-name: Apache 2.0
    info-license-url: https://www.apache.org/licenses/LICENSE-2.0.html
    security-scheme: jwt
    security-scheme-name: bearerAuth
    security-scheme-description: Provide the JWT token issued by the OS Service.

  swagger-ui:
    path: /q/swagger-ui
    title: Oficina Billing API
    # Em produção, SWAGGER_UI_ENABLED=false para não expor a superfície da API.
    always-include: ${SWAGGER_UI_ENABLED:true}

# ── JWT ─────────────────────────────────────────────────────────────────────--
# O Billing não emite token: valida os do OS Service (ADMIN/MECHANIC) com a chave pública RS256
# do par do OS e o mesmo issuer. A chave chega por caminho externo (Secret montado em Kubernetes,
# volume no Compose, .local-jwt/ em dev) e nunca pelo repositório ou pela imagem.
mp:
  jwt:
    verify:
      issuer: ${JWT_ISSUER:oficina-api}
      publickey:
        location: ${JWT_PUBLIC_KEY_LOCATION:.local-jwt/publicKey.pem}

# ── Perfil de teste ─────────────────────────────────────────────────────────--
# Só o formato do log muda. Banco, schema e chaves vêm dos QuarkusTestResource; o Flyway migra o
# container e o Hibernate continua em validate.
"%test":
  quarkus:
    log:
      console:
        json:
          enabled: false
        format: "%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{2.}] %s%e%n"
